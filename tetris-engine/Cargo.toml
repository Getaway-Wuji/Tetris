[package]
name = "tetris-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "tetris_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
